</style></head><body><div id="app"></div><script>
const pics={
me:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=140&h=140&fit=crop&crop=faces',
nia:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=140&h=140&fit=crop&crop=faces',
leo:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=140&h=140&fit=crop&crop=faces',

marcus:'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=140&h=140&fit=crop&crop=faces',
amelia:'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=140&h=140&fit=crop&crop=faces'};
const names={me:'Daniel Nelson',nia:'Nia Bennett',leo:'Leo Martins',sara:'Sara Kim',marcus:'Marcus Cole',amelia:'Amelia Rose'};
const avatars=id=>'<img class="avatar" src="'+pics[id]+'" alt="'+names[id]+'">';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photo='https://images.unsplash.com/';
const original=[
{id:'p1',who:'nia',text:"Little reminder: you don't have to have it all figured out to make something beautiful. Just start creating. ✨",img:photo+'photo-1490750967868-88aa4486c946?w=1000&h=640&fit=crop',likes:2483,comments:['This is exactly what I needed today 🫶'],time:'2h'},
{id:'p2',who:'leo',text:'The city at golden hour just hits differently. No filters, just light and a little luck. 🌇',img:photo+'photo-1519501025264-65ba15a82390?w=1000&h=640&fit=crop',likes:1829,comments:['These colors!!'],time:'4h'},
{id:'p3',who:'marcus',text:"What's one small thing that made your week better? Mine was finally shipping a side project I've been working on for months. 🚀",img:'',likes:956,comments:[],time:'6h'},
{id:'p4',who:'sara',text:'Collect memories, not just miles. A little piece of paradise from my last escape. 🌊',img:photo+'photo-1500534623283-312aade485b7?w=1000&h=640&fit=crop',likes:4106,comments:[],time:'8h'}];
const defaultChats={
nia:[{mine:false,text:'Hey Daniel! Have you seen the new creative meetup?'},{mine:true,text:"Not yet! Where's it happening?"},{mine:false,text:"I'll send you the details later 💚"}],
leo:[{mine:false,text:'Just sent over some shots from yesterday 📸'}],
sara:[{mine:false,text:'We need to plan another adventure soon!'}],
marcus:[{mine:false,text:'Your new project sounds amazing 🔥'}],
amelia:[]};
function load(key,fallback){try{let a=JSON.parse(localStorage.getItem('zyvra-'+key));return a??fallback}catch{return fallback}}
let state={view:'home',tab:'for',chat:'nia',posts:load('posts',original),liked:load('liked',[]),saved:load('saved',[]),follow:load('follow',['nia','leo','sara']),chats:load('chats',defaultChats),stories:load('stories',[]),media:'',profile:load('profile',{name:'Daniel Nelson',bio:'Building things, telling stories, and finding inspiration in the everyday. ✨'}),commentsOpen:'',clip:0,clipLiked:[],search:''};
function save(){['posts','liked','saved','follow','chats','stories','profile'].forEach(k=>{try{localStorage.setItem('zyvra-'+k,JSON.stringify(state[k]))}catch{}})}
function say(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2700)}
const go=v=>{state.view=v;location.hash=v;render();scrollTo(0,0)};
function postHTML(p){const like=state.liked.includes(p.id),saved=state.saved.includes(p.id),on=state.commentsOpen===p.id;return '<article class="post"><div class="post-head">'+avatars(p.who)+'<div><strong>'+esc(p.who==='me'?state.profile.name:names[p.who])+'</strong><small>@'+esc(p.who)+' · '+esc(p.time)+'</small></div></div><p class="post-content">'+esc(p.text)+'</p>'+(p.img?'<img class="post-img" src="'+p.img+'" alt="Shared photo" loading="lazy">':'')+'<div class="actions"><button class="'+(like?'on':'')+'" onclick="toggleLike(\''+p.id+'\')">'+(like?'♥':'♡')+' '+(p.likes+(like?1:0))+'</button><button onclick="commentToggle(\''+p.id+'\')">♧ '+p.comments.length+'</button><button onclick="say(\'Reposting will be available with real accounts.\')">↻</button><button onclick="sharePage()">↗ Share</button><button class="'+(saved?'on':'')+'" onclick="bookmark(\''+p.id+'\')">▱ '+(saved?'Saved':'Save')+'</button></div>'+(on?'<div class="comments">'+p.comments.map(c=>'<p>💬 '+esc(c)+'</p>').join('')+'<form onsubmit="addComment(event,\''+p.id+'\')"><input name="comment" placeholder="Write a reply..." maxlength="250" required><button>Send</button></form></div>':'')+'</article>'}
function home(){return '<section class="hero"><span class="eyebrow">✳ YOUR WORLD, UNFILTERED</span><h2>Find your <em>people.</em></h2><p>Good conversations. Great discoveries. All your moments.</p></section><section class="stories"><div class="title-row"><h3>Moments for you</h3><small>See what’s new ↗</small></div><div class="story-row"><button class="story" onclick="document.getElementById(\'story-file\').click()"><span class="story-ring"><img src="'+pics.me+'"></span>＋ Your story</button>'+['nia','leo','sara','amelia'].map((who,i)=>'<button class="story" onclick="viewStory('+i+')"><span class="story-ring"><img src="'+pics[who]+'"></span>'+names[who].split(' ')[0]+'</button>').join('')+(state.stories.filter(s=>Date.now()-s.created<86400000).length?'<button class="story" onclick="viewStory(4)"><span class="story-ring"><img src="'+pics.me+'"></span>My moment</button>':'')+'</div></section><section class="editor"><div class="editor-line">'+avatars('me')+'<textarea id="post-text" placeholder="What’s happening in your world?" maxlength="500"></textarea></div><img id="photo-preview" class="preview" style="display:none"><div class="editor-tools"><button class="link" onclick="document.getElementById(\'post-file\').click()" title="Add photo">▧ ＋</button><button class="primary" onclick="publish()">Post ↗</button></div></section><div class="feed-tabs"><button class="'+(state.tab==='for'?'active':'')+'" onclick="changeTab(\'for\')">For you</button><button class="'+(state.tab==='following'?'active':'')+'" onclick="changeTab(\'following\')">Following</button></div>'+state.posts.filter(p=>state.tab==='for'||state.follow.includes(p.who)||p.who==='me').map(postHTML).join('')+(!state.posts.some(p=>state.tab==='for'||state.follow.includes(p.who)||p.who==='me')?'<div class="empty">Follow someone to see their posts.</div>':'')}
function discover(){const arts=['photo-1500530855697-b586d89ba3ee','photo-1515886657613-9f3515b0c78f','photo-1464822759023-fed622ff2c3b','photo-1541701494587-cb58502866ab','photo-1500534314209-a25ddb2bd429','photo-1490481651871-ab68de25d43d'];let matches=state.posts.filter(p=>(p.text+' '+names[p.who]).toLowerCase().includes(state.search.toLowerCase()));return '<section class="page"><div class="intro"><span class="eyebrow">✳ GO BEYOND YOUR FEED</span><h2>Discover <em>something new.</em></h2><p>Ideas worth exploring. People worth knowing.</p></div><input class="search" placeholder="Search creators and posts..." id="discover-search" value="'+esc(state.search)+'" oninput="setSearch(this.value)"><div id="discover-results">'+(state.search?matches.map(postHTML).join('')||'<div class="empty">No matching posts yet.</div>':'<div class="topics">'+['#MadeOnZYVRA','#DailyInspo','#BehindTheScenes','#WeekendMood'].map(t=>'<div class="topic"><small>Trending in creativity</small><strong>'+t+'</strong><small>Made by the community ↗</small></div>').join('')+'</div><div class="title-row" style="margin-top:34px"><h3>Visual diary</h3><small>Fresh inspiration ↗</small></div><div class="grid">'+arts.map(a=>'<img src="'+photo+a+'?w=430&h=620&fit=crop" loading="lazy" alt="Community inspiration">').join('')+'</div>')+'</div></section>'}
function messages(){return '<div class="chat-layout"><section class="threads"><h2>Messages<span style="color:var(--lime)">.</span></h2>'+Object.keys(state.chats).map(id=>'<button class="thread '+(state.chat===id?'active':'')+'" onclick="openChat(\''+id+'\')">'+avatars(id)+'<div><strong>'+names[id]+'</strong><small>'+esc((state.chats[id].at(-1)||{}).text||'Start a conversation')+'</small></div></button>').join('')+'</section><section class="chat-panel"><div class="chat-head">'+avatars(state.chat)+'<strong>'+names[state.chat]+'</strong></div><div class="disclaimer">Preview only · messages stay on this device and are NOT sent to other people.</div><div class="chat-stream">'+state.chats[state.chat].map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+esc(m.text)+'</div>').join('')+'</div><form class="message-form" onsubmit="sendChat(event)"><input name="message" placeholder="Write a message..." maxlength="1000" required><button class="primary">➤</button></form></section></div>'}
const clips=[{who:'sara',caption:'POV: you finally booked that trip 🌴✨',url:'https://videos.pexels.com/video-files/2795750/2795750-hd_1080_1920_25fps.mp4',poster:photo+'photo-1507525428034-b723cf961d3e?w=720&h=1200&fit=crop'},{who:'leo',caption:'Chasing the light, one frame at a time 🌆',url:'https://videos.pexels.com/video-files/3129671/3129671-hd_1080_1920_25fps.mp4',poster:photo+'photo-1519501025264-65ba15a82390?w=720&h=1200&fit=crop'},{who:'amelia',caption:'Find beauty in the everyday ✨',url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',poster:photo+'photo-1490750967868-88aa4486c946?w=720&h=1200&fit=crop'}];
function clipsHTML(){let c=clips[state.clip];return '<section class="page"><div class="intro"><span class="eyebrow">✳ THE GOOD STUFF</span><h2>ZYVRA <em>clips.</em></h2><p>Short moments, big feelings.</p></div><div class="clips"><div class="clip"><video src="'+c.url+'" poster="'+c.poster+'" controls muted playsinline loop autoplay></video><div class="clip-info"><strong>@'+c.who+'</strong>'+c.caption+'</div></div><div class="clip-controls"><button onclick="nextClip(-1)">← Previous</button><button onclick="nextClip(1)">Next →</button></div><small style="color:var(--muted);margin-top:12px">Demo media uses external public video URLs; availability may vary.</small></div></section>'}
function profileHTML(){return '<section class="page"><div class="cover"></div><div class="profile-head">'+avatars('me')+'<div><h2>'+esc(state.profile.name)+'</h2><small style="color:var(--muted)">@daniel · Lagos, Nigeria</small></div></div><p style="margin-top:20px">'+esc(state.profile.bio)+'</p><p style="color:var(--muted)">'+state.posts.filter(p=>p.who==='me').length+' posts · '+state.follow.length+' following</p><form class="editbox" onsubmit="editSave(event)"><label>Display name<input class="field" name="name" maxlength="40" required value="'+esc(state.profile.name)+'"></label><label>Bio<textarea class="field" name="bio" maxlength="180" rows="3">'+esc(state.profile.bio)+'</textarea></label><button class="primary">Save profile</button></form></section><div class="feed-tabs"><button class="active">Your posts</button></div>'+state.posts.filter(p=>p.who==='me').map(postHTML).join('') }
function bookmarks(){let posts=state.posts.filter(p=>state.saved.includes(p.id));return '<section class="page"><div class="intro"><span class="eyebrow">✳ THE ONES TO KEEP</span><h2>Saved <em>moments.</em></h2><p>Things worth coming back to.</p></div></section>'+ (posts.length?posts.map(postHTML).join(''):'<div class="empty"><strong>Nothing saved yet</strong>Tap the bookmark button on a post to save it.</div>')}
function notifications(){return '<section class="page"><div class="intro"><span class="eyebrow">✳ STAY IN THE LOOP</span><h2>What’s <em>new.</em></h2><p>All the little moments that bring us together.</p></div>'+['Nia Bennett liked your recent post.','Sara Kim started following you.','Leo Martins mentioned you in a conversation.','Marcus Cole shared a new post.'].map(n=>'<div class="notice">✳ '+n+'<small style="display:block;color:var(--muted)">Demo activity</small></div>').join('')+'</section>'}
const items=[['home','⌂','Home'],['discover','◇','Explore'],['clips','▷','Clips'],['messages','☏','Messages'],['notifications','♧','Notifications'],['bookmarks','▱','Bookmarks'],['profile','◉','Profile']];
function render(){const v=state.view;const main=v==='home'?home():v==='discover'?discover():v==='clips'?clipsHTML():v==='messages'?messages():v==='profile'?profileHTML():v==='bookmarks'?bookmarks():notifications();document.getElementById('app').innerHTML='<div class="app"><aside class="side"><div class="brand"><span class="logo">ϟ</span>zyvra<i>.</i></div><div class="small-label">YOUR SPACE</div><nav class="nav">'+items.map(a=>'<button class="'+(v===a[0]?'active':'')+'" onclick="go(\''+a[0]+'\')"><b>'+a[1]+'</b>'+a[2]+'</button>').join('')+'</nav><button class="primary create" onclick="go(\'home\');document.getElementById(\'post-text\').focus()">＋ Create post</button><div class="side-footer">'+avatars('me')+'<div><strong>'+esc(state.profile.name)+'</strong><span>@daniel</span></div></div></aside><main class="main"><header class="top"><div><h1>'+(items.find(a=>a[0]===v)||['','','Home'])[2]+'</h1><small>✳ Your daily spark</small></div><strong>zyvra.</strong></header>'+main+'</main><aside class="right"><input class="search" placeholder="Search ZYVRA..." onkeydown="if(event.key===\'Enter\'){state.search=this.value;go(\'discover\')}"><section class="card highlight"><span class="eyebrow">ϟ THE ZYVRA EFFECT</span><h3>Your world,<br><span>your energy.</span></h3><p>A little more creativity, a lot more connection.</p><button onclick="go(\'home\')">Share your vibe →</button></section><section class="card"><h3>What’s trending ↗</h3>'+['#MadeOnZYVRA','#DailyInspo','#BehindTheScenes'].map(t=>'<div class="trend"><small>Trending in creativity</small><strong>'+t+'</strong><small>Join the conversation</small></div>').join('')+'</section><section class="card"><h3>People to know ✳</h3>'+['marcus','amelia','sara'].map(id=>'<div class="person">'+avatars(id)+'<div><strong>'+names[id]+'</strong><small>@'+id+'</small></div><button onclick="follow(\''+id+'\')">'+(state.follow.includes(id)?'✓':'+')+'</button></div>').join('')+'</section><div class="foot">ZYVRA © 2026 · Made for connection.<br>Interactive preview · Not a live social network</div></aside></div><nav class="mobile-nav">'+items.filter(a=>['home','discover','clips','messages','profile'].includes(a[0])).map(a=>'<button class="'+(v===a[0]?'active':'')+'" onclick="go(\''+a[0]+'\')"><b>'+a[1]+'</b>'+a[2]+'</button>').join('')+'</nav><input id="post-file" type="file" accept="image/*" hidden onchange="addPhoto(event)"><input id="story-file" type="file" accept="image/*" hidden onchange="addStory(event)">';}
function changeTab(tab){state.tab=tab;render()}
function toggleLike(id){state.liked=state.liked.includes(id)?state.liked.filter(x=>x!==id):[...state.liked,id];save();render()}
function bookmark(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render();say('Saved posts updated')}
function follow(id){state.follow=state.follow.includes(id)?state.follow.filter(x=>x!==id):[...state.follow,id];save();render()}
function commentToggle(id){state.commentsOpen=state.commentsOpen===id?'':id;render()}
function addComment(e,id){e.preventDefault();let input=e.target.elements.comment;let post=state.posts.find(p=>p.id===id);if(post&&input.value.trim()){post.comments.push(input.value.trim().slice(0,250));save();render()}}
function publish(){let el=document.getElementById('post-text'),text=el.value.trim();if(!text&&!state.media){say('Write something or choose a photo first');return}state.posts.unshift({id:String(Date.now()),who:'me',text,img:state.media||'',likes:0,comments:[],time:'now'});state.media='';save();render();say('Post added to your browser preview!')}
function addPhoto(e){const f=e.target.files[0];if(!f)return;if(f.size>1500000){say('Choose an image smaller than 1.5MB');return}const r=new FileReader();r.onload=()=>{state.media=r.result;let el=document.getElementById('photo-preview');el.src=r.result;el.style.display='block'};r.readAsDataURL(f)}
function addStory(e){const f=e.target.files[0];if(!f)return;if(f.size>1500000){say('Choose an image smaller than 1.5MB');return}const r=new FileReader();r.onload=()=>{state.stories.unshift({img:r.result,created:Date.now()});save();render();say('Your local story is available for 24 hours')};r.readAsDataURL(f)}
const baseStories=[{who:'nia',img:photo+'photo-1490750967868-88aa4486c946?w=720&h=1200&fit=crop',txt:'Little magic today ✨'},{who:'leo',img:photo+'photo-1519501025264-65ba15a82390?w=720&h=1200&fit=crop',txt:'Golden hour 📸'},{who:'sara',img:photo+'photo-1507525428034-b723cf961d3e?w=720&h=1200&fit=crop',txt:'Out of office 🌴'},{who:'amelia',img:photo+'photo-1513364776144-60967b0f800f?w=720&h=1200&fit=crop',txt:'Studio mornings 🎨'}];
function viewStory(i){let stories=baseStories.concat(state.stories.filter(s=>Date.now()-s.created<86400000).map(s=>({who:'me',img:s.img,txt:'My moment ✨'})));let s=stories[i];if(!s)return;let div=document.createElement('div');div.className='story-layer';div.id='story-layer';div.innerHTML='<div class="story-view"><img src="'+s.img+'" alt="Story"><strong>'+names[s.who]+'</strong><p>'+s.txt+'</p><button onclick="document.getElementById(\'story-layer\').remove()">×</button></div>';div.onclick=e=>{if(e.target===div)div.remove()};document.body.appendChild(div)}
function openChat(id){state.chat=id;render()}
function sendChat(e){e.preventDefault();let input=e.target.elements.message;let text=input.value.trim();if(text){state.chats[state.chat].push({mine:true,text:text.slice(0,1000)});save();render();say('Saved locally — not delivered to another user')}}
function nextClip(dir){state.clip=(state.clip+dir+clips.length)%clips.length;render()}
function editSave(e){e.preventDefault();state.profile={name:e.target.elements.name.value.trim(),bio:e.target.elements.bio.value.trim()};save();render();say('Profile saved in this browser')}
function setSearch(s){state.search=s;const results=document.getElementById('discover-results');if(results){let matches=state.posts.filter(p=>(p.text+' '+names[p.who]).toLowerCase().includes(s.toLowerCase()));if(s)results.innerHTML=matches.map(postHTML).join('')||'<div class="empty">No matching posts yet.</div>';else{let el=document.activeElement;render();document.getElementById('discover-search').focus()}}}
function sharePage(){if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>say('Website link copied')).catch(()=>say('Cannot copy link from this page'));else say('Copy the URL from your browser')}
window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(items.some(a=>a[0]===id)){state.view=id;render()}});
if(items.some(a=>a[0]===location.hash.slice(1)))state.view=location.hash.slice(1);
render();
</script></body></html>
