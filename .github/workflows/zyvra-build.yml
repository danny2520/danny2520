name: ZYVRA - Typecheck and Build
on:
  push:
    branches:
      - feat/zyvra-social-foundation
    paths:
      - "zyvra-app/**"
      - ".github/workflows/zyvra-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zyvra-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Run foundation tests
        run: npm test
      - name: Build Next.js
        run: npm run build
